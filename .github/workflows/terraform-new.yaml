name: Terraform-new

on:
  workflow_dispatch: 

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/112192593580/locations/global/workloadIdentityPools/identity-pool/providers/github-provider
          service_account: github-sa@terraform-gcp-resources.iam.gserviceaccount.com

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init

      - name: import the existing resources
        run: |
          terraform import google_service_account.terraform_gcp_sa
          terraform import google_storage_bucket.gcs_bucket
          terraform import google_compute_network.vpc
          terraform import google_compute_subnetwork.public_subnet
          terraform import google_compute_subnetwork.private_subnet
      - run: terraform plan
      - run: terraform apply -auto-approve
